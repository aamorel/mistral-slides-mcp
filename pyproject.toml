[project]
name = "mcp-slides"
version = "0.1.0"
description = "MCP connector for creating, reading, revising, extending and styling Google Slides presentations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "mcp[cli]",
    "mistralai>=2.9.4",
    "pillow>=11",
]

[project.scripts]
mcp-slides = "mcp_slides.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
